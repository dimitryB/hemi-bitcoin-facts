# hemi-bitcoin-facts contracts.
#
# Compile settings follow the brief and the x402 facilitator's X402BtcSettler build:
# solc 0.8.28, cancun, optimizer 200 runs. No CBOR metadata in the default profile so
# CREATE2 addresses depend on source only. Deploy.s.sol pins each init-code hash (docs/DECISIONS.md D-024), and source
# verification on Blockscout must use these same settings (no metadata), or the bytecode will not match.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
cbor_metadata = false
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 1024

# Fork tests read Hemi mainnet through the public RPC (about 300 requests a minute, shared with anything else
# running). ~80 compute units a second keeps a fork near 4 requests a second, as the SDK's anvil harness does,
# and 429s are retried with backoff.
[rpc_endpoints]
hemi = { endpoint = "https://rpc.hemi.network/rpc", retries = 8, retry_backoff = 1000, compute_units_per_second = 80 }
hemi_testnet = "https://testnet.rpc.hemi.network/rpc"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"
ignore = ["lib/**"]
